services:
  # ============================================================================
  # 1. MySQL 8 Database Service (Internal network only — not exposed publicly)
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: nagaed-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-RootSecretPassword123!}
      MYSQL_DATABASE: ${DB_NAME:-nagaed_assessment}
      MYSQL_USER: ${DB_USER:-nagaed_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-RootSecretPassword123!}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - nagaed-network

  # ============================================================================
  # 2. Node.js / Express Backend API
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nagaed-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-nagaed_user}
      DB_PASSWORD: ${DB_PASSWORD:-RootSecretPassword123!}
      DB_NAME: ${DB_NAME:-nagaed_assessment}
      DB_CONNECTION_LIMIT: 10
      JWT_SECRET: ${JWT_SECRET:-dev_only_secret_replace_in_production_minimum_32_chars_long}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      BCRYPT_SALT_ROUNDS: 12
      CORS_ORIGIN: "http://localhost,http://localhost:80,http://localhost:5173"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nagaed-network

  # ============================================================================
  # 3. Python FastAPI AI Microservice (Groq Integration)
  # ============================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: nagaed-ai-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      ENVIRONMENT: production
      GROQ_API_KEY: ${GROQ_API_KEY:-gsk_placeholder_replace_with_real_groq_key}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nagaed-network

  # ============================================================================
  # 4. React Frontend (Nginx Production Server & Internal Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_AI_SERVICE_URL: ${VITE_AI_SERVICE_URL:-/api}
    container_name: nagaed-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nagaed-network

volumes:
  mysql_data:
    name: nagaed_mysql_data

networks:
  nagaed-network:
    name: nagaed_network
    driver: bridge
